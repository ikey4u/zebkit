# Tasks for zebkit, run with mise (https://mise.jdx.dev).
#
#   mise run r                release build for this machine  -> dist/release, and its archive
#   mise run r:github         the same, published as a GitHub release
#   mise run r:crate          the Rust crates to crates.io (CARGO_REGISTRY_TOKEN)
#   mise run r:python         the Python binding to PyPI (UV_PUBLISH_TOKEN or PYPI_TOKEN)
#   mise run d                debug build for this machine    -> dist/debug
#   mise example:linux:basic  build and run examples/window.c, a small browser window
#   mise example:macos:basic  build and run examples/window.c on macOS
#   mise example:ffmpeg       build and run examples/ffmpeg.cpp, which uses the engine's FFmpeg
#   mise example:rust:window  run the Rust crate's window example
#   mise example:rust:codecs  run the Rust crate's example of the engine's FFmpeg
#
# "mise d" works as a short form of "mise run d". "mise r" does not run the
# task r: it is mise's own short form of "mise run", which with no task
# named asks which one to run.

# The GitHub CLI, for r:github only. mise installs it on first use;
# nothing has to be installed by hand. It needs to be logged in once
# ("mise exec -- gh auth login"), or given a token in GH_TOKEN.
#
# xz packs the release archive. macOS has none of its own, and one version
# on every machine keeps the archive, and so its checksum, the same
# wherever it is made.
[tools]
gh = "2.102.0"
"conda:xz-tools" = "5.8.3"
# uv, for r:python only: builds the Python package and uploads it.
uv = "0.13.7"

[tasks.r]
description = "Build the release zebkit for Linux (dist/release) and macOS (dist/release-macos, cross-built), and the archives the Rust crates download"
run = "scripts/release.sh"

[tasks."r:github"]
description = "Build the release and publish it as the GitHub release v<VERSION>"
run = "scripts/release.sh --publish"

[tasks."r:crate"]
description = "Publish the Rust crates (zebkit-rs, zebkit-build, zebkit) at VERSION to crates.io; the token in CARGO_REGISTRY_TOKEN (--dry-run to check only)"
run = "scripts/publish-crates.sh"

[tasks."r:python"]
description = "Publish the Python binding at VERSION to PyPI as zebkit; the token in UV_PUBLISH_TOKEN or PYPI_TOKEN (--dry-run to check only)"
run = "scripts/publish-python.sh"

[tasks."bench:web"]
description = "What web pages cost in zebkit against Electron; --check fails on a regression past tests/bench/web/limits.json (pass --sites for the well-known sites)"
run = "scripts/web-bench.sh"

[tasks.d]
description = "Build zebkit with debug information for this machine into dist/debug"
run = "scripts/dist.sh debug"

[tasks."example:linux:basic"]
description = "Build and run examples/window.c: a small browser window (pass a URL after --)"
run = "scripts/example.sh linux-basic"

[tasks."example:macos:basic"]
description = "Build and run examples/window.c against Zebkit.framework (pass a URL after --)"
run = "scripts/example.sh macos-basic"

[tasks."example:ffmpeg"]
description = "Build and run examples/ffmpeg.cpp: decode an MP3 to WAV with the FFmpeg inside zebkit (pass IN.mp3 OUT.wav after --)"
run = "scripts/example.sh ffmpeg"

[tasks."example:rust:window"]
description = "Run the Rust crate's window example against the built engine (pass a URL after --)"
dir = "bindings/rust"
# Chromium's sandbox needs unprivileged user namespaces; where the system
# gives none, the example runs without it.
run = """
sandbox=""
[ "$(uname -s)" = Linux ] && ! unshare --user true 2>/dev/null && sandbox=--no-sandbox
cargo run --example window -- $sandbox
"""

[tasks."example:rust:codecs"]
description = "Run the Rust crate's codecs example: what the FFmpeg inside zebkit has"
dir = "bindings/rust"
run = "cargo run --example codecs"

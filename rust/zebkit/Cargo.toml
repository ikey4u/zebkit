[package]
name = "zebkit"
description = "A web engine to embed: web views, the Chrome DevTools Protocol endpoint, and the libraries inside the engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"
# So that an application's build script is told where the engine is
# (DEP_ZEBKIT_ENGINE_DIR), which is what zebkit-build works from.
links = "zebkit_engine"

[dependencies]
zebkit-rs = { path = "../zebkit-rs", version = "=0.0.1-alpha.3" }

# One process, one main loop: the test is a program, not a set of threads.
[[test]]
name = "engine"
harness = false

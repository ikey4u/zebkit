# Pinned upstream engine release. Sourced by scripts/lib.sh.
#
# The engine is Chromium's content layer and Blink, at a stable release.
# Bump CHROMIUM_VERSION to another tag of chromium/src; the dependencies
# (V8, Skia, the toolchain Chromium builds with, its sysroot) follow from
# the DEPS file at that tag, which gclient reads.
CHROMIUM_VERSION=155.0.8059.84
CHROMIUM_URL=https://chromium.googlesource.com/chromium/src.git

# Chromium's checkout and build tools. Pinned, and not left to update
# themselves, so that a fetch is the same on every machine.
DEPOT_TOOLS_URL=https://chromium.googlesource.com/chromium/tools/depot_tools.git
DEPOT_TOOLS_COMMIT=889099791deff38466d471fa6590951c91a1d8ab

# Electron, the size baseline (scripts/electron-baseline.sh): its prebuilt
# runtime for Linux x86-64, at the stable release, checked by its SHA-256.
ELECTRON_VERSION=45.2.1
ELECTRON_LINUX_X64_SHA256=616efc1ae4784af1a4f3f0e8774e73e7030e7bd1708da9d09bcf543dfa499beb

# Playwright, whose injected script (selectors, actionability, ARIA) and
# US keyboard layout zebkit's automation runs (docs/AUTOMATION.md):
# scripts/playwright-sources.sh bundles them from this commit into
# src/engine/playwright/. esbuild is the version Playwright builds with.
PLAYWRIGHT_URL=https://github.com/microsoft/playwright.git
PLAYWRIGHT_COMMIT=cfe490d941f992655948eee8fd4fd94e1c4234bf
PLAYWRIGHT_ESBUILD_VERSION=0.28.1
# playwright-core from npm, the latest stable release, for
# scripts/automation-bench.sh's comparison over CDP.
PLAYWRIGHT_CORE_VERSION=1.64.1
# Puppeteer's client, development only, for tests/engine/cdp_clients.mjs.
PUPPETEER_CORE_VERSION=25.16.0
# Playwright's own tests, the tag of the protocol zebkit's endpoint speaks,
# for scripts/playwright-suite.sh.
PLAYWRIGHT_SUITE_TAG=v1.64.1
# The YAML library Playwright pins (its package.json), bundled with the
# injected script for ariaSnapshot's YAML.
PLAYWRIGHT_YAML_VERSION=2.9.0
# The official MCP client and conformance suite, development only, for
# tests/engine/mcp_*.mjs: tools/zebkit-mcp ships nothing of them.
# A real long PDF for tests/engine/pdf_in_page.py: the PDF specification, 756
# pages, development only.
PDF_REAL_URL=https://opensource.adobe.com/dc-acrobat-sdk-docs/pdfstandards/PDF32000_2008.pdf
PDF_REAL_SHA256=9de0ca9e8570d6209e8bd48a355be8eb6ec376acfc3fc3ae97cd8730351417ff
MCP_SDK_VERSION=1.32.2
MCP_CONFORMANCE_VERSION=0.1.16

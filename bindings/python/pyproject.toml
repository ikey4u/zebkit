[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "zebkit"
# The engine's version (VERSION); scripts/publish-python.sh checks they agree.
version = "0.2.0"
description = "Chromium's engine as a library, from Python: web views, PDF, media, Playwright's API natively, and the libraries inside the engine"
readme = "README.md"
license = "LGPL-2.1-or-later"
requires-python = ">=3.8"
keywords = ["chromium", "browser", "webview", "pdf", "playwright", "automation"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

[project.urls]
Homepage = "https://github.com/ikey4u/zebkit"
Documentation = "https://github.com/ikey4u/zebkit/blob/main/docs/API.md"
Releases = "https://github.com/ikey4u/zebkit/releases"

[tool.uv.build-backend]
module-root = ""
module-name = "zebkit"

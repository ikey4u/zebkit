[workspace]
resolver = "2"
members = ["zebkit-rs", "zebkit", "zebkit-build"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "LGPL-2.1-or-later"
repository = "https://github.com/ikey4u/zebkit"
readme = "README.md"
# File::set_modified (1.75), aborting where a panic would leave an extern "C"
# function (1.81), Option::is_none_or in an example (1.82).
rust-version = "1.82"
keywords = ["browser", "webview", "chromium", "cdp", "pdf"]
categories = ["gui", "web-programming", "api-bindings"]

[package]
name = "zebkit-gpui-browser"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
zebkit = { path = "../../bindings/rust/zebkit" }
gpui-kit = { version = "0.9.0", features = ["gpui-fast"] }
raw-window-handle = "0.6"
serde_json = "1"
futures = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[build-dependencies]
zebkit-build = { path = "../../bindings/rust/zebkit-build" }

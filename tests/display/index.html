<!doctype html><meta charset=utf-8><title>zebkit display test</title>
<style>
  html, body { margin: 0; height: 100%; background: #1565c0; color: white; font: 28px sans-serif; }
  #box { position: absolute; left: 100px; top: 100px; width: 300px; height: 200px; background: #ffb300; }
  input { position: absolute; left: 100px; top: 340px; font-size: 24px; width: 290px; }
</style>
<div id=box></div><input id=field autofocus>
<script>
// Reports what input reaches the page, so scripts/display.sh can check that a
// display backend delivers pointer, wheel and keyboard events as well as pixels.
const seen = {};
const report = (kind, detail) => { if (seen[kind]) return; seen[kind] = 1; fetch('/event?' + kind + '=' + encodeURIComponent(detail)); };
addEventListener('load', () => report('loaded', innerWidth + 'x' + innerHeight));
document.getElementById('box').addEventListener('click', e => report('click', e.clientX + ',' + e.clientY + ',button' + e.button));
addEventListener('wheel', e => report('wheel', Math.sign(e.deltaY)));
addEventListener('mousemove', e => report('move', 'yes'));
document.getElementById('field').addEventListener('input', e => { if (e.target.value.length >= 3) report('typed', e.target.value); });
</script>

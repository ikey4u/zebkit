<!doctype html>
<!-- tests/engine/page.c and cdp_page.py: dialogs, drags, a slider. -->
<html>
<head>
<meta charset="utf-8">
<title>page</title>
<style>
  body { margin: 0; font: 16px sans-serif; width: 400px; }
  #list { list-style: none; margin: 0; padding: 0; position: absolute; left: 0; top: 0; width: 200px; }
  #list li { height: 40px; line-height: 40px; box-sizing: border-box; border: 1px solid #888; background: #def; padding-left: 8px; }
  #drop { position: absolute; left: 0; top: 220px; width: 400px; height: 80px; background: #fed; }
  #file { position: absolute; left: 0; top: 320px; width: 300px; height: 40px; }
  #slider { position: absolute; left: 0; top: 380px; width: 200px; height: 20px; margin: 0; }
  #out { position: absolute; left: 220px; top: 0; width: 180px; height: 40px; background: #efe; }
</style>
</head>
<body>
<ul id="list">
  <li draggable="true" data-id="a">a</li>
  <li draggable="true" data-id="b">b</li>
  <li draggable="true" data-id="c">c</li>
  <li draggable="true" data-id="d">d</li>
  <li draggable="true" data-id="e">e</li>
</ul>
<div id="out" draggable="true">out</div>
<div id="drop">drop here</div>
<input id="file" type="file" multiple>
<input id="slider" type="range" min="0" max="100" value="0">
<script>
  // A sortable list: an item dropped on another goes before it.
  const list = document.getElementById('list');
  let dragged = null;
  window.events = [];
  list.addEventListener('dragstart', (e) => {
    dragged = e.target.closest('li');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', 'item ' + dragged.dataset.id);
    e.dataTransfer.setData('application/x-zebkit-item', dragged.dataset.id);
    events.push('dragstart');
  });
  list.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
  list.addEventListener('drop', (e) => {
    e.preventDefault();
    const target = e.target.closest('li');
    events.push('drop:' + e.dataTransfer.getData('application/x-zebkit-item'));
    if (target && dragged && target !== dragged)
      list.insertBefore(dragged, target.compareDocumentPosition(dragged) & Node.DOCUMENT_POSITION_FOLLOWING ? target : target.nextSibling);
  });
  list.addEventListener('dragend', (e) => { events.push('dragend:' + e.dataTransfer.dropEffect); });
  window.order = () => [...list.children].map((li) => li.dataset.id).join('');

  // Something the application takes out of the page.
  const out = document.getElementById('out');
  out.addEventListener('dragstart', (e) => {
    e.dataTransfer.effectAllowed = 'copyLink';
    e.dataTransfer.setData('text/plain', 'out text');
    e.dataTransfer.setData('text/uri-list', 'https://example.com/out');
    e.dataTransfer.setData('text/html', '<b>out</b>');
    events.push('out-dragstart');
  });
  out.addEventListener('dragend', (e) => { events.push('out-dragend:' + e.dataTransfer.dropEffect); });

  // What is dropped from outside.
  const drop = document.getElementById('drop');
  window.dropped = null;
  window.entered = 0;
  drop.addEventListener('dragenter', (e) => { e.preventDefault(); entered++; });
  drop.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  drop.addEventListener('drop', async (e) => {
    e.preventDefault();
    const files = [...e.dataTransfer.files];
    const record = {
      types: [...e.dataTransfer.types],
      text: e.dataTransfer.getData('text/plain'),
      custom: e.dataTransfer.getData('application/x-mine'),
      files: files.map((f) => f.name),
      shiftKey: e.shiftKey,
    };
    record.contents = files.length ? await files[0].text() : '';
    window.dropped = record;
  });
  document.getElementById('file').addEventListener('change', (e) => {
    window.chosen = [...e.target.files].map((f) => f.name);
  });

  // Dialogs.
  window.guard = () => addEventListener('beforeunload', (e) => { e.preventDefault(); e.returnValue = ''; });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Long document</title>
<!-- scripts/electron-compare.sh: a long document, as an EPUB is shown, 2,000
     paragraphs of about 200,000 words: until its first frame, its full
     layout, and scrolling from top to bottom in steps of a frame. -->
<style>
  body { margin: 0 auto; max-width: 720px; font: 18px/1.6 Georgia, serif; color: #222; }
  h2 { font-size: 1.4em; }
</style>
<div id="book"></div>
<script>
const words = ('it is interesting to contemplate an entangled bank clothed with many plants of many kinds with birds singing on the ' +
  'bushes with various insects flitting about and with worms crawling through the damp earth and to reflect that these ' +
  'elaborately constructed forms so different from each other and dependent on each other in so complex a manner').split(' ');
let seed = 1;
const next = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
let html = '';
for (let p = 0; p < 2000; p++) {
  if (p % 25 === 0) html += `<h2>Chapter ${p / 25 + 1}</h2>`;
  let text = '';
  for (let w = 0; w < 100; w++) text += words[Math.floor(next() * words.length)] + (w % 12 === 11 ? '. ' : ' ');
  html += `<p>${text}</p>`;
}
const started = performance.now();
const book = document.getElementById('book');
book.innerHTML = html;
const out = { build_ms: 0, first_frame_ms: 0, height: 0, longest_task_ms: 0 };
new PerformanceObserver(list => {
  for (const entry of list.getEntries()) out.longest_task_ms = Math.max(out.longest_task_ms, Math.round(entry.duration));
}).observe({ type: 'longtask', buffered: true });
out.height = document.documentElement.scrollHeight;
out.build_ms = Math.round(performance.now() - started);
requestAnimationFrame(() => requestAnimationFrame(() => {
  out.first_frame_ms = Math.round(performance.now() - started);
  const frames = [];
  let last = performance.now();
  const end = last + 15000;
  const step = () => {
    const now = performance.now();
    frames.push(now - last);
    last = now;
    window.scrollBy(0, 200);
    if (now < end && window.scrollY + innerHeight < out.height) return requestAnimationFrame(step);
    frames.sort((a, b) => a - b);
    out.frames = frames.length;
    out.frame_p50_ms = +frames[frames.length >> 1].toFixed(1);
    out.frame_p95_ms = +frames[Math.floor(frames.length * 0.95)].toFixed(1);
    out.frame_max_ms = +frames[frames.length - 1].toFixed(1);
    fetch('/result', { method: 'POST', body: JSON.stringify(out) });
  };
  requestAnimationFrame(step);
}));
</script>
</html>

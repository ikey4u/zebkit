<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dialogs</title>
</head>
<body>
<button id="alert" onclick="alert('hello'); window.afterAlert = true">alert</button>
<button id="confirm" onclick="window.confirmed = confirm('sure?')">confirm</button>
<button id="prompt" onclick="window.answer = prompt('name?', 'nobody')">prompt</button>
<button id="open" onclick="window.popup = window.open('second.html?popup=1')">open</button>
</body>
</html>

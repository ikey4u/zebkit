<!doctype html><meta charset=utf-8><title>smoke</title>
<style>#b{width:321px;height:45px;display:flex}</style><div id=b><span>hello</span></div>
<canvas id=c width=8 height=8></canvas>
<script>
(async () => {
  const r = document.getElementById('b').getBoundingClientRect();
  const ctx = document.getElementById('c').getContext('2d'); ctx.fillStyle = '#f00'; ctx.fillRect(0,0,8,8);
  const px = Array.from(ctx.getImageData(1,1,1,1).data).join('.');
  let wasm = 'none';
  try { const m = await WebAssembly.instantiate(new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11])); wasm = m.instance.exports.add(40,2); } catch (e) { wasm = 'err:' + e.message; }
  let s = 0; for (let i = 0; i < 3e6; i++) s += i % 7;
  const intl = new Intl.NumberFormat('en-US').format(1234567.5);
  // WebGL: clear to a known colour and read it back.
  let webgl = 'none';
  try {
    const gl = document.createElement('canvas').getContext('webgl');
    if (gl) {
      gl.clearColor(0, 1, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      const out = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, out);
      webgl = Array.from(out).join('.');
    }
  } catch (e) { webgl = 'err'; }
  // Hot enough to reach the optimizing JIT, which once built a Map for
  // "new Set" when the linker had merged their type descriptors.
  let wrongTypes = 0;
  for (let n = 0; n < 60000; n++) {
    const c = n % 3 ? new Set : new Map;
    if (typeof (n % 3 ? c.add : c.set) !== 'function') wrongTypes++;
  }
  await fetch('/result?layout=' + r.width + 'x' + r.height + '&px=' + px + '&wasm=' + wasm + '&loop=' + s + '&intl=' + encodeURIComponent(intl) + '&wrongTypes=' + wrongTypes + '&webgl=' + webgl);
})();
</script>
